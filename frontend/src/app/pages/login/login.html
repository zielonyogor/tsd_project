<div class="login-page">
  <header class="login-header">
    <h1 class="title">Sign in</h1>
    <p>Use your username to continue.</p>
  </header>

  <form class="login-card" (ngSubmit)="login()">
    <label class="field-label" for="login-name">Username</label>
    <input
      id="login-name"
      type="text"
      class="field-input"
      [(ngModel)]="userName"
      name="userName"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      required
    />

    <label class="field-label" for="login-password">Password</label>
    <input
      id="login-password"
      type="password"
      class="field-input"
      [(ngModel)]="password"
      name="password"
      autocomplete="current-password"
      autocapitalize="none"
      spellcheck="false"
      required
    />

    @if (loginError) {
      <p class="error-msg">{{ loginError }}</p>
    }

    <div class="actions-row">
      <button class="card-action-btn" type="submit" [disabled]="isLoggingIn">
        {{ isLoggingIn ? 'Signing in…' : 'Sign in' }}
      </button>
    </div>
  </form>
  <p class="signup-link">
    Don't have an account?
    <a routerLink="/register">Sign up</a>
  </p>
</div>
